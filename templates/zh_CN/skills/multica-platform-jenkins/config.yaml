# multica-platform-jenkins — Jenkins 平台配置（无凭据）
version: "1.1"

jenkins:
  base_url: "http://<JENKINS_URL>"
  curl_resolve: ""  # 例: "<JENKINS_URL>:<JENKINS_INTERNAL_IP>" （若需绑定内网解析）
  timeout_seconds: 1800
  poll_interval_seconds: 5

# dev / sit 环境默认参数（Job 清单见 jobs-catalog.yaml）
environments:
  dev:
    default_branch: master
    # default_params 仅在 --no-auto-params 时使用；正常流程由 Jenkins API 发现参数
    default_params: {}
    deploy_base_url: ""

  sit:
    default_branch: master
    default_params: {}
    deploy_base_url: ""

defaults:
  environment: sit
  branch: master

# 旧项目预设占位壳：不携带真实项目名、Job 名或 token。
# 其他团队如需兼容旧流程，请在本地按实际 Jenkins 配置替换这些占位符。
legacy_profiles:
  sit:
    job_path: "/view/<JENKINS_VIEW>/job/<JENKINS_JOB_SIT>"
    default_params:
      env: sit
      token: <JENKINS_PARAM_TOKEN>
    projects:
      - <PROJECT_BACKEND>
      - <PROJECT_FRONTEND>
      - <PROJECT_SCHEDULER>

