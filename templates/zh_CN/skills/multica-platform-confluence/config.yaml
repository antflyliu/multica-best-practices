# multica-platform-confluence — Confluence 平台配置（无凭据）
version: "1.0"

confluence:
  url: "http://<CONFLUENCE_URL>"
  default_space: "CRM"
  default_parent_page_id: "<CONFLUENCE_PARENT_PAGE_ID>"      # PRD 默认父页面
  design_parent_page_id: "<CONFLUENCE_DESIGN_PAGE_ID>"       # 技术设计文档父页面
  # 完整空间列表见 spaces.json（来自 dev-workflow/confluence.conf）

projects:
  default:
    design_parent_page_id: "<CONFLUENCE_DESIGN_PAGE_ID>"
  <ISSUE_PREFIX_A>:
    confluence_space: "CDS"
    design_parent_page_id: "<CONFLUENCE_DESIGN_PAGE_ID>"
  AAI:
    confluence_space: "CRM"
    design_parent_page_id: "<CONFLUENCE_DESIGN_PAGE_ID>"

local_paths:
  requirements_dir: "docs/requirements"    # 需求文档本地缓存（fetch 时用）
  design_dir: "docs/design"                # 技术设计草稿：docs/design/<ISSUE-KEY>/design.md



