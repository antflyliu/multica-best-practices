# ============================================
# multica-artifact-req-sync — PRD 编排默认值（向后兼容）
# Confluence / JIRA 主配置已迁至 platform skills：
#   multica-platform-confluence/config.yaml
#   multica-platform-jira/config.yaml
# 凭据在 .env 或 ATLASSIAN_USER / ATLASSIAN_PASS 环境变量
# ============================================

version: "1.0"

# ── Confluence 配置
confluence:
  url: "http://<CONFLUENCE_URL>"
  default_space: "CRM"
  default_parent_page_id: "<CONFLUENCE_PARENT_PAGE_ID>"
  spaces:
    - { key: "CRM",          name: "CRM 项目" }
    - { key: "~example-user", name: "个人空间示例" }

# ── JIRA 全局配置
jira:
  url: "<JIRA_URL>"
  issue_type_id: "<JIRA_OPTION_ID_10001>"   # Story

# ── JIRA 工作流字段（项目可在 projects.<KEY>.workflow_fields 覆盖）
workflow_fields:
  sprint:                 { customId: "<JIRA_CUSTOM_FIELD_10004>", type: "number", label: "Sprint",       required: false }
  design_hours:           { customId: "<JIRA_CUSTOM_FIELD_15700>", type: "number", label: "设计时间",       required: false }
  test_owner:             { customId: "<JIRA_CUSTOM_FIELD_14301>", type: "user",   label: "测试Owner",     required: false }
  estimated_test_date:    { customId: "<JIRA_CUSTOM_FIELD_14303>", type: "date",   label: "预计提测时间",   required: false }
  estimated_release_date: { customId: "<JIRA_CUSTOM_FIELD_12500>", type: "date",   label: "预计发布日期",   required: false }

# ── JIRA 项目配置
# 核心设计：每个项目的自定义字段通过 fields 映射
# 新增项目只需复制一段配置，修改 customId 即可
projects:

  # ── AAI 项目
  AAI:
    id: "<JIRA_OPTION_ID_18500>"
    name: "<JIRA_PROJECT_NAME>"
    default_epic: "<JIRA_ISSUE_KEY>"
    epics:
      - { key: "<JIRA_ISSUE_KEY>", name: "<JIRA_PROJECT_A_EPIC_NAME>" }
    fields:
      need_user:     { customId: "<JIRA_CUSTOM_FIELD_11700>", type: "user",   label: "需求人",             required: true }
      background:    { customId: "<JIRA_CUSTOM_FIELD_12200>", type: "string", label: "需求背景",            required: true }
      center_source: { customId: "<JIRA_CUSTOM_FIELD_14700>", type: "array",  label: "需求来源（中心级）",  required: true }
      region_source: { customId: "<JIRA_CUSTOM_FIELD_16100>", type: "object", label: "需求来源（区域）",    required: true }
      req_type:      { customId: "<JIRA_CUSTOM_FIELD_14305>", type: "array",  label: "需求类型",            required: true }
      compliance:    { customId: "<JIRA_CUSTOM_FIELD_14602>", type: "object", label: "是否涉及合规",        required: true }
      epic_link:     { customId: "<JIRA_CUSTOM_FIELD_10000>", type: "string", label: "Epic Link",          required: true }
    field_options:
      center_source:
        - { label: "国内医学",          id: "<JIRA_OPTION_ID_14100>" }
        - { label: "产品研发中心",       id: "<JIRA_OPTION_ID_12906>" }
        - { label: "医学支持&教育中心",  id: "<JIRA_OPTION_ID_12903>" }
        - { label: "国内事业中心",       id: "<JIRA_OPTION_ID_12900>" }
        - { label: "软件研发中心",       id: "<JIRA_OPTION_ID_12904>" }
        - { label: "系统软件中心",       id: "<JIRA_OPTION_ID_12905>" }
      region_source:
        - { label: "国内",     id: "<JIRA_OPTION_ID_14600>" }
        - { label: "集团",     id: "<JIRA_OPTION_ID_14606>" }
        - { label: "海外共享", id: "<JIRA_OPTION_ID_14601>" }
      req_type:
        - { label: "业务需求", id: "<JIRA_OPTION_ID_12500>" }
        - { label: "产品需求", id: "<JIRA_OPTION_ID_12501>" }
        - { label: "技术需求", id: "<JIRA_OPTION_ID_12502>" }
        - { label: "配置需求", id: "<JIRA_OPTION_ID_14500>" }
      compliance:
        - { label: "涉及",   id: "<JIRA_OPTION_ID_12704>" }
        - { label: "不涉及", id: "<JIRA_OPTION_ID_12705>" }

  # ── MDP 项目
  MDP:
    id: "<JIRA_OPTION_ID_18700>"
    name: "<JIRA_PROJECT_B_NAME>"
    default_epic: "<JIRA_ISSUE_KEY>"
    epics:
      - { key: "<JIRA_ISSUE_KEY>", name: "<JIRA_PROJECT_B_NAME>" }
    fields:
      need_user:     { customId: "<JIRA_CUSTOM_FIELD_11700>", type: "user",   label: "需求人",             required: true }
      background:    { customId: "<JIRA_CUSTOM_FIELD_12200>", type: "string", label: "需求背景",            required: true }
      center_source: { customId: "<JIRA_CUSTOM_FIELD_14700>", type: "array",  label: "需求来源（中心级）",  required: true }
      region_source: { customId: "<JIRA_CUSTOM_FIELD_16100>", type: "object", label: "需求来源（区域）",    required: true }
      req_type:      { customId: "<JIRA_CUSTOM_FIELD_14305>", type: "array",  label: "需求类型",            required: true }
      compliance:    { customId: "<JIRA_CUSTOM_FIELD_14602>", type: "object", label: "是否涉及合规",        required: true }
      epic_link:     { customId: "<JIRA_CUSTOM_FIELD_10000>", type: "string", label: "Epic Link",          required: true }
    field_options:
      center_source:
        - { label: "产品研发中心", id: "<JIRA_OPTION_ID_12906>" }
        - { label: "软件研发中心", id: "<JIRA_OPTION_ID_12904>" }
        - { label: "系统软件中心", id: "<JIRA_OPTION_ID_12905>" }
      region_source:
        - { label: "国内", id: "<JIRA_OPTION_ID_14600>" }
        - { label: "集团", id: "<JIRA_OPTION_ID_14606>" }
      req_type:
        - { label: "产品需求", id: "<JIRA_OPTION_ID_12501>" }
        - { label: "技术需求", id: "<JIRA_OPTION_ID_12502>" }
        - { label: "配置需求", id: "<JIRA_OPTION_ID_14500>" }
      compliance:
        - { label: "涉及",   id: "<JIRA_OPTION_ID_12704>" }
        - { label: "不涉及", id: "<JIRA_OPTION_ID_12705>" }

# ── 工作流默认值（创建 Story 时的缺省参数）
defaults:
  project: "AAI"
  center_source: "国内医学"
  region_source: "集团"
  req_type: "业务需求"
  compliance: "不涉及"
  need_user: "<requester-username>"
  background: "无"

# ── 钉钉通知配置（Token 在 .env 中）
dingtalk:
  enabled: true
  project_webhook_map:
    AAI: "<DINGTALK_WEBHOOK>"
    MDP: "<DINGTALK_WEBHOOK>"

# ── PRD 文档模板分区
prd_template:
  sections:
    - "需求背景"
    - "需求目标"
    - "需求范围"
    - "功能详情"
    - "验收标准"
    - "上线时间"
    - "相关链接"





