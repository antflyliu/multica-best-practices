# multica-test-automation — Apifox CLI 配置（无 token）
version: "1.0"

apifox:
  out_dir: "./apifox-reports"
  default_reporters: "cli,html,json"
  upload_report: true
  # 全局注入：run_apifox.py 会把 {{base_url}} 替换为 --base-url
  env_vars:
    - "baseUrl={{base_url}}"

defaults:
  environment_id: ""   # 团队填写 Apifox 环境 ID

# Issue 前缀 → 默认场景（T3）
# 注意：以下为示例映射，请按你的「Issue 前缀 → Apifox 场景」替换为真实配置。
issue_scenario_map:
  <ISSUE_PREFIX_A>:
    scenario_id: ""      # 例: "<APIFOX_SCENARIO_ID>"
    environment_id: ""   # 例: "<APIFOX_ENV_ID>"
    test_suite_id: ""    # 可选，与 scenario_id 二选一
