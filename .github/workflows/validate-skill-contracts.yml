name: Validate Skill Contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-skill-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate Skill Contracts and zh/en parity
        run: python scripts/validate-skill-contracts.py
